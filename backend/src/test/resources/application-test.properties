spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

jwt.secret=unit-test-secret-key-0123456789abcdef

# normally provided by .env / dotenv — needed by WebSocketConfig etc.
CLIENT_URL=http://localhost:5173
SERVER_URL=http://localhost:8081
# NOTE: the main-code default "${ADMIN_PASSWORD:#{Admin52341}}" is invalid SpEL —
# if these are missing the context crashes. Set explicitly for tests.
ADMIN_EMAIL=admin@test.com
ADMIN_PASSWORD=test-admin-password

spring.mail.host=localhost
spring.mail.port=3025

#need to be changed for emails
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.facebook.client-id=test-client-id
spring.security.oauth2.client.registration.facebook.client-secret=test-client-secret
